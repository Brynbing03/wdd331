<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning CSS Demo</title>
    <link rel="stylesheet" href="dist/styles.css">

    <!-- <link rel="stylesheet" href="css/main.css"> -->

<body>

        <h1>Lightning CSS Demo</h1>
        <p>Learning how to bundle and optimize CSS.</p>
    </header>

    <main class="container">
        <h2>Why use Lightning CSS?</h2>

        <div class="card-grid">
            <article class="card">
                <h3>Bundle</h3>
                <p>
                    Combine multiple CSS files into one stylesheet.
                </p>
            </article>

            <article class="card">
                <h3>Minify</h3>
                <p>
                    Remove unnecessary spaces and make the CSS smaller.
                </p>
            </article>

            <article class="card">
                <h3>Optimize</h3>
                <p>
                    Prepare modern CSS to work across different browsers.
                </p>
            </article>
        </div>
    </main>
