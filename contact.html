
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Brynlee Bingham</title>

    <script src="js/theme-preference.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <div class="contact-page">

        <!-- navigation -->
        <nav class="contact-nav" aria-label="Main navigation">
            <a href="index.html">← Back to Portfolio</a>
            <a href="resume.html">View Resume</a>
        </nav>

        <main class="contact-card">

            <header class="contact-header">
                <p class="contact-eyebrow">LET'S CONNECT</p>
                <h1>Contact Me</h1>
                <p>
                    Have a question or just want to say hi?
                    Feel free to leave me a message!
                </p>
            </header>

            <!-- contact form -->
            <form id="contact-form">

                <div class="form-group">
                    <label for="contact-name">Your Name</label>
                    <input
                        type="text"
                        id="contact-name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address</label>
                    <input
                        type="email"
                        id="contact-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contact-message">Your Message</label>
                    <textarea
                        id="contact-message"
                        name="message"
                        placeholder="Write your message here..."
                        rows="5"
                        required
                    ></textarea>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="contact-updates"
                        name="updates"
                    >
                    <label for="contact-updates">
                        I'd like to receive updates about new projects.
                    </label>
                </div>

                <button type="submit" class="contact-submit">
                    Send Message
                </button>

                <p id="form-status" role="status" aria-live="polite"></p>

            </form>

        </main>

        <footer class="contact-footer">
            <p>© 2026 Brynlee Bingham</p>
        </footer>

    </div>

    <script>
        // the demo form - no backend is connected.
        const form = document.querySelector("#contact-form");
        const status = document.querySelector("#form-status");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            status.textContent =
                "This is a demo form, so your message was not sent.";
        });
    </script>
</body>
</html>
